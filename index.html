const tasks=[{"stage": 0, "word": 0, "name": "近義詞配對", "a": ["小心翼翼", "賠不是", "理直氣壯", "精益求精"], "c": 1, "h": "怕得罪別人而格外客氣、陪笑或道歉。", "e": "「賠不是」表示道歉，與賠小心的意思接近；小心翼翼則是形容做事謹慎。"}, {"stage": 0, "word": 1, "name": "近義詞配對", "a": ["挑剔", "隨便", "注重", "焦慮"], "c": 2, "h": "做作品時重視品質、方法或細節。", "e": "「注重」表示重視，與此處的講究意思相近；挑剔偏向過分要求。"}, {"stage": 0, "word": 2, "name": "近義詞配對", "a": ["著急", "憤怒", "失望", "沉著"], "c": 0, "h": "因事情緊迫或擔心結果而不安。", "e": "焦急與著急都表示心裡急切不安；憤怒則是生氣。"}, {"stage": 0, "word": 3, "name": "近義詞配對", "a": ["漫不經心", "手忙腳亂", "猶豫不決", "不慌不忙"], "c": 3, "h": "遇到突發狀況仍能鎮定處理。", "e": "不慌不忙與從從容容都表示態度沉著，不慌亂；並非不在乎。"}, {"stage": 0, "word": 4, "name": "近義詞配對", "a": ["病入膏肓", "死裡逃生", "喪命", "昏迷"], "c": 2, "h": "故事中人物因病失去生命。", "e": "「喪命」與一命嗚呼都指死亡；病入膏肓指病情嚴重，未必已死亡。"}, {"stage": 0, "word": 5, "name": "近義詞配對", "a": ["模範", "模仿", "對手", "偶像劇"], "c": 0, "h": "可以讓其他人學習的好典範。", "e": "榜樣和模範都可以指值得學習的人或事物；模仿是學習別人行為的動作。"}, {"stage": 1, "word": 0, "name": "詞卡分類", "pair": "賠小心 — 道歉", "c": 0, "h": "向對方表達歉意，並格外客氣。", "e": "在做錯事、怕對方生氣的情境中，兩詞意思相近；賠小心另有討好或放低姿態的意味。"}, {"stage": 1, "word": 1, "name": "詞卡分類", "pair": "講究 — 馬虎", "c": 1, "h": "想想重視細節和草率處理的差別。", "e": "在做事是否重視品質與細節的情境下，講究與馬虎意思相對。"}, {"stage": 1, "word": 2, "name": "詞卡分類", "pair": "焦急 — 平靜", "c": 1, "h": "比較兩種心情是否安定。", "e": "焦急是著急不安，平靜是心情安定，在此語境中意思相反。"}, {"stage": 1, "word": 3, "name": "詞卡分類", "pair": "從從容容 — 手忙腳亂", "c": 1, "h": "比較面對突發狀況時的反應。", "e": "從從容容表示不慌不忙，手忙腳亂則表示慌張而沒有條理。"}, {"stage": 1, "word": 4, "name": "詞卡分類", "pair": "一命嗚呼 — 死亡", "c": 0, "h": "兩詞是否都表示生命結束？", "e": "兩詞都指生命結束，意思相近，但一命嗚呼語氣較戲謔，不適合正式慰問。"}, {"stage": 1, "word": 5, "name": "詞卡分類", "pair": "榜樣 — 典範", "c": 0, "h": "兩者是否都值得學習？", "e": "榜樣與典範都指可以作為學習、效法的對象。"}, {"stage": 2, "word": 0, "name": "道歉背後的秘密", "story": "小杰在教室打翻同學的水壺，擔心對方生氣，連忙陪著笑臉，放低聲音道歉。", "q": "小杰的態度最適合用哪個詞語形容？", "a": ["小心翼翼", "焦急", "賠小心", "從從容容"], "c": 2, "h": "注意他對同學說話的態度，而非拿水壺的動作。", "e": "他擔心對方責怪而格外客氣、道歉，符合賠小心；焦急只描述心情，未指出他的道歉行為。"}, {"stage": 2, "word": 1, "name": "品質鑑定室", "story": "技藝課製作蛋糕時，小安已完成作品，卻仍仔細調整奶油花的位置，確認食材比例與外觀。", "q": "最能說明小安對作品品質的態度的是？", "a": ["講究", "從從容容", "焦急", "賠小心"], "c": 0, "h": "重點是他為什麼反覆調整細節。", "e": "小安重視食材比例與作品外觀，因此是講究，不只是完成得快或動作從容。"}, {"stage": 2, "word": 2, "name": "時間的考驗", "story": "上課鐘快響了，小明還在走廊，想到自己可能遲到，忍不住一直查看手錶，加快腳步。", "q": "哪個詞語最精確地描述小明當下的心情？", "a": ["憤怒", "講究", "從從容容", "焦急"], "c": 3, "h": "他擔心即將發生的結果。", "e": "小明因時間緊迫、擔心遲到而著急不安，最適合用焦急形容。"}, {"stage": 2, "word": 3, "name": "講臺上的考驗", "story": "班會報告時，投影設備突然故障。小華並未慌張，而是拿起講稿，按照原先的順序清楚說明。", "q": "小華最適合被形容為如何處理突發狀況？", "a": ["講究", "從從容容", "賠小心", "焦急"], "c": 1, "h": "注意他遇到問題後仍按順序完成報告。", "e": "從從容容表示不慌不忙、沉著應對。講究則強調重視品質和細節，不是這段的核心。"}, {"stage": 2, "word": 4, "name": "課堂上的故事", "story": "國文課讀到《差不多先生傳》的結局：差不多先生病重，卻認為醫人的醫生與醫治動物的醫生差不多，最後失去了生命。", "q": "如果用課文中的詞語描述這個結局，最適合的是？", "a": ["病入膏肓", "死裡逃生", "一命嗚呼", "焦急"], "c": 2, "h": "注意故事最後是病重、獲救，還是死亡。", "e": "一命嗚呼表示死亡。病入膏肓只表示病情嚴重，死裡逃生則表示幸運活下來，都不是這個結局。"}, {"stage": 2, "word": 5, "name": "校園模範生", "story": "小美每天主動整理教室，認真完成任務，也耐心協助不懂題目的同學。班上的同學都希望向她學習。", "q": "同學把小美視為什麼？", "a": ["對手", "榜樣", "模仿", "講究"], "c": 1, "h": "重點是其他同學想向她學習。", "e": "榜樣是值得學習的對象。模仿是學習別人行為的動作，不是指這個人本身。"}];

const $=id=>document.getElementById(id), labels=['詞義密碼','語意雷達','情境推理'], cats=['近義詞（相似詞）','反義詞（相反詞）'], letters='ABCD';
const keyicon='<svg class="keyicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="m12 12 9 9m-5-5 3-3m-1 5 3-3"/></svg>',lockicon='<svg class="keyicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
let level=0,phase='intro',passed=Array(18).fill(false),first=Array(18).fill(null),attempts=0,hintCount=0,choice=-1,left=false,hintUsed=false,correct=false;
const current=()=>tasks[level];const count=()=>passed.filter(Boolean).length;const wordCount=i=>[i,i+6,i+12].filter(j=>passed[j]).length;
function clear(){choice=-1;left=false;hintUsed=false;correct=false}
function hud(){const s=Math.floor(level/6);$('stages').innerHTML=labels.map((x,i)=>`<div class="stagebox ${passed.slice(i*6,i*6+6).every(Boolean)?'complete':phase!=='intro'&&phase!=='done'&&i===s?'active':''}">第${i+1}關｜${x}<small>${passed.slice(i*6,i*6+6).filter(Boolean).length}／6 題</small></div>`).join('');$('hud').innerHTML=words.map((w,i)=>`<div class="slot ${wordCount(i)===3?'got':''} ${phase==='question'&&current().word===i?'current':''}">${wordCount(i)===3?keyicon:lockicon}<span>${w}</span><span class="keyprogress">${wordCount(i)}/3</span></div>`).join('');$('status').innerHTML=`<span>鑰匙 ${words.filter((_,i)=>wordCount(i)===3).length}／6　｜　任務 ${count()}／18</span><span>挑戰 ${attempts} 次・提示 ${hintCount} 次</span>`;$('progress').style.width=count()/18*100+'%';}
function intro(){phase='intro';hud();$('screen').innerHTML=`<div class="landing"><img src="${images.boy}" alt="和中青少年男學生"><div class="intro"><div class="eyebrow">ESCAPE ROOM / 18 MISSIONS</div><h2>六把鑰匙<br>三重封印</h2><p>六個詞語各有三道封印。完成近義詞配對、詞卡分類與情境推理，才能收集全部六把鑰匙。</p><p>三大關卡，每關6題，共18題。<br>答錯可重試，完成一題才解鎖下一題。</p><button class="primary" id="start">接受任務　→</button></div><img src="${images.girl}" alt="和中青少年女學生"></div>`;$('start').onclick=()=>{phase='question';render()};}
function render(){hud();const t=current(),w=words[t.word],s=t.stage;const story=s===2?t.story:'觀察漫畫中的人物行為與情境，再判斷詞語的意思。';$('screen').innerHTML=`<div class="stage"><aside class="scene"><div class="eyebrow">圖文線索 / ${String(level+1).padStart(2,'0')}</div><img src="${images['q'+(t.word+1)]}" alt="${s===2?t.name:'詞語'}的漫畫情境"><div class="story">${story}</div></aside><section class="content"><div class="tag">第${s+1}關｜${labels[s]}　·　${level%6+1}/6</div><h2>${t.name}</h2><div id="taskbody"></div></section></div>`;phase==='result'?resultPage():question();}
function question(){const t=current();let prompt=t.stage===0?'先點選左側詞卡，再點選右側意思最接近的詞語。':t.stage===1?'將這張詞卡拖曳至正確分類區，或直接點選分類。':t.q;$('taskbody').innerHTML=`<p class="prompt">${prompt}</p><div id="controls"></div><div class="hint" id="hintbox" ${hintUsed?'':'hidden'}><b>解謎提示：</b>${t.h}</div><div class="actions"><button class="ghost" id="hint">${hintUsed?'收起提示':'取得提示'}</button><button class="primary" id="submit">確認答案　→</button></div>`;$('hint').onclick=()=>{let box=$('hintbox');if(box.hidden){if(!hintUsed)hintCount++;hintUsed=true;box.hidden=false;$('hint').textContent='收起提示';hud()}else{box.hidden=true;$('hint').textContent='取得提示'}};$('submit').onclick=submit;drawControls();}
function drawControls(){const t=current(),area=$('controls');if(t.stage===0){area.innerHTML=`<div class="matchboard"><div><div class="labelrow">課文詞語</div><button id="leftcard" class="opt target ${left?'selected':''}" aria-pressed="${left}">${words[t.word]}</button></div><div class="connector ${left?'active':''}">→</div><div><div class="labelrow">候選近義詞</div><div class="options">${t.a.map((v,i)=>`<button class="opt ${choice===i?'selected':''}" data-opt="${i}" aria-pressed="${choice===i}" ${left?'':'disabled'}>${v}</button>`).join('')}</div></div></div><p class="subnote">${left?'已選取左側詞卡，請選擇右側答案。':'請先選取左側詞卡。'}</p>`;$('leftcard').onclick=()=>{left=!left;choice=-1;drawControls()};}
else if(t.stage===1){area.innerHTML=`<div id="dragcard" class="dragcard" draggable="true">${t.pair}</div><div class="connector">↓</div><div class="twodrops">${cats.map((v,i)=>`<button class="zone ${choice===i?'selected':''}" data-zone="${i}" aria-pressed="${choice===i}"><b>${v}</b><small>${i===0?'意思相近':'意思相反'}</small>${choice===i?'<span class="chip">'+t.pair+'</span>':''}</button>`).join('')}</div><p class="subnote">電腦可拖曳詞卡；平板直接點選分類即可。</p>`;const card=$('dragcard');card.ondragstart=e=>{e.dataTransfer.setData('text/plain','wordcard');e.dataTransfer.effectAllowed='move'};area.querySelectorAll('[data-zone]').forEach(el=>{el.onclick=()=>{choice=+el.dataset.zone;drawControls()};el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>{e.preventDefault();if(e.dataTransfer.getData('text/plain')==='wordcard'){choice=+el.dataset.zone;drawControls()}}});}
else{area.innerHTML=`<div class="options">${t.a.map((v,i)=>`<button class="opt ${choice===i?'selected':''}" data-opt="${i}" aria-pressed="${choice===i}"><span class="letter">${letters[i]}</span>${v}</button>`).join('')}</div>`;}
area.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{choice=+b.dataset.opt;drawControls()});$('submit').disabled=choice<0;}
function submit(){if(choice<0)return;const t=current();correct=choice===t.c;attempts++;if(first[level]===null)first[level]=correct;if(correct)passed[level]=true;phase='result';render();}
function resultPage(){const t=current(),answer=t.stage===0?words[t.word]+' ↔ '+t.a[t.c]:t.stage===1?t.pair+' → '+cats[t.c]:letters[t.c]+'. '+t.a[t.c];const picked=t.stage===1?cats[choice]:t.a[choice];$('taskbody').innerHTML=`<div class="feedback ${correct?'confetti':'wrong'}"><div class="eyebrow">${correct?'封印解除 / UNLOCKED':'再找一次線索 / TRY AGAIN'}</div><h2>${correct?(wordCount(t.word)===3?'取得「'+words[t.word]+'」鑰匙！':'成功解除一道封印！'):'再試一次，你可以的！'}</h2><p>你的答案：${picked}</p></div><div class="explain"><h3>正確答案</h3><div class="answertext">${answer}</div><h3 style="margin-top:15px">答案解析</h3><p>${t.e}</p></div><div class="actions"><span class="small">${words[t.word]}：${wordCount(t.word)}／3 道封印</span><button class="primary" id="advance">${correct?(level%6===5?'完成本關':'下一題'):'重新挑戰'}　→</button></div>`;$('advance').onclick=()=>{if(!correct){clear();phase='question';render();return}if(level===17){finish();return}if(level%6===5){stageComplete();return}level++;clear();phase='question';render()};}
function stageComplete(){phase='break';hud();const s=current().stage;$('screen').innerHTML=`<div class="stagecomplete confetti"><div class="eyebrow">STAGE ${s+1} COMPLETE</div><h2>第${s+1}關｜${labels[s]} 破解成功！</h2><img src="${images.win}" alt="和中學生慶祝"><p>六個詞語都已完成本關練習。</p><p>首次答對：${first.slice(s*6,s*6+6).filter(v=>v===true).length}／6 題</p><button class="primary" id="nextstage">進入第${s+2}關｜${labels[s+1]}　→</button></div>`;$('nextstage').onclick=()=>{level++;clear();phase='question';render()};}
function finish(){phase='done';hud();$('screen').innerHTML=`<div class="finish confetti"><div class="eyebrow">MISSION COMPLETE / 18 OF 18</div><h2>六把鑰匙全部收集成功！</h2><img src="${images.win}" alt="和中學生慶祝解鎖成功"><h3>文字解謎達人</h3><p>完成18／18題　｜　首次答對 ${first.filter(v=>v===true).length}／18 題　｜　挑戰 ${attempts} 次</p><div class="medals">${words.map(w=>`<div class="medal">${keyicon} ${w}</div>`).join('')}</div><h3>學習成果紀錄</h3><p class="small">「首次正確」表示第一次就答對；「修正完成」表示經過重試後答對。</p><table class="summarytable"><thead><tr><th>詞語</th>${labels.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${words.map((w,i)=>`<tr><th>${w}</th>${[i,i+6,i+12].map(j=>`<td class="${first[j]?'pass':'retry'}">${first[j]?'首次正確':'修正完成'}</td>`).join('')}</tr>`).join('')}</tbody></table><p>看得懂、分得清、自己用得出來。</p><button class="primary" id="again">重新挑戰</button></div>`;$('again').onclick=restart;}
function restart(){level=0;passed=Array(18).fill(false);first=Array(18).fill(null);attempts=0;hintCount=0;clear();intro()}
$('restart').onclick=()=>{if(phase==='intro'||phase==='done'||confirm('要清除目前進度並重新開始嗎？'))restart()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else alert('此瀏覽器不支援全螢幕，請使用瀏覽器的全螢幕功能。')}catch(e){alert('請使用瀏覽器的全螢幕功能。')}};document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'離開全螢幕':'全螢幕'});intro();
</script></body></html>
